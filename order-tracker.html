<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consignment — Order Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5FB;
    --sidebar:#FFFFFF;
    --card:#FFFFFF;
    --border:#E9EBF5;
    --text:#1D2333;
    --muted:#8991A8;
    --primary:#5B5FEF;
    --primary-dark:#4548C9;
    --primary-soft:#EEEEFE;
    --success:#16B993;
    --success-soft:#E5FBF3;
    --warning:#F5A524;
    --warning-soft:#FFF6E4;
    --danger:#F0435A;
    --danger-soft:#FEEAEE;
    --amazon:#F0A94E;
    --flipkart:#5B8DEF;
    --myntra:#E85D8A;
    --ajio:#8B6BC7;
    --other:#7C8194;
    --radius:18px;
    --radius-sm:12px;
    --shadow: 0 1px 2px rgba(29,35,51,0.04), 0 8px 24px rgba(29,35,51,0.05);
    --tint:#F5F6FC;
    --tint-strong:#FAFBFE;
    --other-soft:#F1F1FE;
    --other-fg:#7C7FE8;
  }
  [data-theme="dark"]{
    --bg:#12141C;
    --sidebar:#171A24;
    --card:#1B1E29;
    --border:#2B2F40;
    --text:#E8EAF5;
    --muted:#8B90A8;
    --primary:#7B7FFF;
    --primary-dark:#9598FF;
    --primary-soft:rgba(123,127,255,0.16);
    --success:#22D3A6;
    --success-soft:rgba(34,211,166,0.14);
    --warning:#FFB648;
    --warning-soft:rgba(255,182,72,0.14);
    --danger:#FF5A72;
    --danger-soft:rgba(255,90,114,0.14);
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.28);
    --tint:#20232F;
    --tint-strong:#1D2029;
    --other-soft:rgba(124,127,232,0.16);
    --other-fg:#9C9FFF;
  }
  body, .sidebar, .card, .stat-card, .table-card, .topbar, .modal, .btn, .search-input, select.range-select, .field input, .field select{
    transition: background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Plus Jakarta Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Sora', sans-serif;}
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit;}

  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px; flex-shrink:0; background:var(--sidebar); border-right:1px solid var(--border);
    padding:24px 16px; display:flex; flex-direction:column; gap:28px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:0 8px;}
  .brand-mark{
    width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg, var(--primary), #8A8DFB);
    display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0;
  }
  .brand-name{font-family:'Sora',sans-serif; font-weight:700; font-size:16.5px; letter-spacing:-0.2px;}
  .brand-tag{font-size:10.5px; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase;}

  .nav-section-label{
    font-size:10.5px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted);
    padding:0 12px; margin-bottom:6px; font-weight:600;
  }
  .nav-list{display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:10px;
    font-size:13.5px; font-weight:500; color:var(--text); cursor:pointer; border:none; background:none;
    width:100%; text-align:left; transition:background .12s;
  }
  .nav-item:hover{background:var(--tint);}
  .nav-item.active{background:var(--primary-soft); color:var(--primary-dark); font-weight:600;}
  .nav-item .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .nav-item .n-label{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .nav-item .n-count{font-size:11px; color:var(--muted); font-family:'JetBrains Mono',monospace;}
  .nav-item.active .n-count{color:var(--primary-dark);}
  .nav-icon{width:16px; height:16px; stroke-width:2; flex-shrink:0;}

  .sidebar-footer{margin-top:auto; padding:12px; border-radius:var(--radius-sm); background:var(--tint); font-size:11.5px; color:var(--muted); line-height:1.5;}

  /* ---------- Main ---------- */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; gap:12px; padding:18px 28px; border-bottom:1px solid var(--border);
    background:var(--sidebar); position:sticky; top:0; z-index:5; flex-wrap:wrap;
  }
  .topbar h1{font-family:'Sora',sans-serif; font-size:19px; font-weight:700; letter-spacing:-0.3px;}
  .topbar .sub{font-size:12px; color:var(--muted); margin-top:1px;}
  .topbar-spacer{flex:1;}
  .search-input{
    background:var(--tint); border:1px solid var(--border); border-radius:10px; padding:9px 12px 9px 34px;
    font-size:13px; color:var(--text); width:200px; position:relative;
  }
  .search-wrap{position:relative;}
  .search-wrap svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--muted);}
  select.range-select{
    background:var(--tint); border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-size:12.5px; color:var(--text);
  }
  .btn{
    display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:600; border-radius:10px;
    padding:9px 15px; border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer;
    transition:transform .08s, box-shadow .12s;
  }
  .btn:hover{box-shadow:var(--shadow);}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:disabled{opacity:0.55; cursor:default; box-shadow:none;}
  .icon{width:15px; height:15px; stroke-width:2.2;}
  .spin{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .content{padding:28px 32px 64px; max-width:1280px; width:100%; margin:0 auto;}

  .banner{padding:11px 16px; border-radius:12px; font-size:13px; margin-bottom:18px; display:flex; gap:8px; align-items:flex-start;}
  .banner-error{background:var(--danger-soft); color:#B0243A;}
  .banner-success{background:var(--success-soft); color:#0E8262;}
  .banner-info{background:var(--primary-soft); color:var(--primary-dark);}

  /* ---------- Stat cards ---------- */
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
  .stat-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px;
    box-shadow:var(--shadow);
  }
  .stat-icon{
    width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    margin-bottom:14px;
  }
  .stat-icon svg{width:18px; height:18px; stroke-width:2.2;}
  .stat-icon.primary{background:var(--primary-soft); color:var(--primary-dark);}
  .stat-icon.success{background:var(--success-soft); color:var(--success);}
  .stat-icon.warning{background:var(--warning-soft); color:var(--warning);}
  .stat-icon.other{background:var(--other-soft); color:var(--other-fg);}
  .stat-value{font-family:'Sora',sans-serif; font-size:24px; font-weight:700; letter-spacing:-0.4px;}
  .stat-label{font-size:12.5px; color:var(--muted); margin-top:3px; font-weight:500;}

  @media(max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}

  /* ---------- Two column: spend + platform mix ---------- */
  .grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:20px;}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px 22px;}
  .card-title{font-family:'Sora',sans-serif; font-size:14.5px; font-weight:700; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between;}
  .card-title .hint{font-size:11px; color:var(--muted); font-weight:500;}

  .spend-row{display:flex; align-items:center; gap:12px; padding:10px 0;}
  .spend-row + .spend-row{border-top:1px solid var(--border);}
  .spend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .spend-info{flex:1; min-width:0;}
  .spend-name{font-size:13px; font-weight:600;}
  .spend-count{font-size:11px; color:var(--muted);}
  .spend-amt{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; white-space:nowrap;}
  .spend-amt.neg{color:var(--danger);}
  .spend-total-row{
    margin-top:8px; padding-top:16px; border-top:2px solid var(--text);
    display:flex; justify-content:space-between; align-items:baseline;
  }
  .spend-total-label{font-family:'Sora',sans-serif; font-weight:700; font-size:13.5px;}
  .spend-total-amt{font-family:'Sora',sans-serif; font-weight:800; font-size:21px; color:var(--primary-dark);}

  .mix-bar{display:flex; height:10px; border-radius:6px; overflow:hidden; margin-bottom:14px; background:var(--tint);}
  .mix-bar span{height:100%;}
  .mix-list{display:flex; flex-direction:column; gap:9px;}
  .mix-item{display:flex; align-items:center; gap:9px; font-size:12.5px;}
  .mix-item .swatch{width:9px; height:9px; border-radius:3px; flex-shrink:0;}
  .mix-item .m-name{flex:1;}
  .mix-item .m-val{font-family:'JetBrains Mono',monospace; color:var(--muted);}

  /* ---------- Orders table ---------- */
  .table-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden;}
  .table-head{display:flex; align-items:center; justify-content:space-between; padding:24px 28px; border-bottom:1px solid var(--border);}
  .table-head .card-title{margin-bottom:0;}
  table{width:100%; border-collapse:collapse; table-layout:fixed;}
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:0.8px; text-transform:uppercase; color:var(--muted);
    font-weight:600; padding:16px 28px; border-bottom:1px solid var(--border); background:var(--tint-strong);
  }
  thead th:first-child{width:36%;}
  thead th:nth-child(2){width:15%;}
  thead th:nth-child(3){width:17%;}
  thead th:nth-child(4){width:16%;}
  thead th:nth-child(5){width:12%;}
  thead th:last-child{width:4%; padding-left:0; padding-right:20px;}
  tbody td{padding:22px 28px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle; line-height:1.5;}
  tbody td:last-child{padding-left:0; padding-right:20px;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--tint-strong);}
  .item-cell{display:flex; align-items:center; gap:16px;}
  .item-swatch{width:7px; height:36px; border-radius:5px; flex-shrink:0;}
  .item-name{font-weight:600; font-size:13.5px; line-height:1.4;}
  .item-sub{font-size:11.5px; color:var(--muted); font-family:'JetBrains Mono',monospace; margin-top:5px; letter-spacing:0.2px;}
  .date-cell{font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--muted); letter-spacing:0.2px; white-space:nowrap;}
  .badge{
    display:inline-flex; align-items:center; padding:5px 13px; border-radius:100px; font-size:11px; font-weight:600; white-space:nowrap;
  }
  .price-cell{font-family:'JetBrains Mono',monospace; font-weight:600; text-align:right; font-size:13.5px; padding-right:28px !important;}
  .del-btn{background:none; border:none; color:var(--muted); cursor:pointer; padding:8px; border-radius:8px; display:flex;}
  .del-btn:hover{color:var(--danger); background:var(--danger-soft);}

  .empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty-state .display{color:var(--text); font-size:16px; margin-bottom:6px; font-weight:700;}

  /* ---------- Modal ---------- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(20,22,35,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{background:var(--card); border-radius:var(--radius); padding:24px; width:100%; max-width:400px; box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .modal h3{font-family:'Sora',sans-serif; font-size:16.5px; font-weight:700; margin-bottom:18px;}
  .field{margin-bottom:13px;}
  .field label{font-size:12px; color:var(--muted); font-weight:600; display:block; margin-bottom:5px;}
  .field input, .field select{
    width:100%; background:var(--tint); border:1px solid var(--border); border-radius:9px;
    padding:9px 11px; color:var(--text); font-size:13.5px; font-family:'Plus Jakarta Sans',sans-serif;
  }
  .field input:focus, .field select:focus{outline:none; border-color:var(--primary);}
  .modal-actions{display:flex; gap:8px; margin-top:18px; justify-content:flex-end;}

  details.debug summary{cursor:pointer; font-size:12px; color:var(--muted); font-weight:600; margin-bottom:18px;}
  details.debug pre{
    background:#1D2333; color:#B7BEDA; border-radius:12px; padding:14px; margin-top:8px; font-size:11.5px;
    white-space:pre-wrap; font-family:'JetBrains Mono',monospace;
  }

  @media(max-width:820px){
    .sidebar{position:fixed; left:0; top:0; z-index:40; transform:translateX(-100%); transition:transform .2s; box-shadow:0 0 40px rgba(0,0,0,0.2);}
    .sidebar.open{transform:translateX(0);}
    .content{padding:18px 16px 48px;}
    .topbar{padding:14px 16px;}
    .search-input{width:130px;}
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY = 'orders';
const KNOWN_PLATFORMS = ['Amazon','Flipkart','Myntra','Ajio'];
const PLATFORM_COLORS = { Amazon:'#F0A94E', Flipkart:'#5B8DEF', Myntra:'#E85D8A', Ajio:'#8B6BC7', Other:'#7C8194' };
const EXTRA_HUES = ['#6FBF73','#D98E5C','#5CC3D9','#C98BD9','#D9C55C','#7D9BD9','#D95C87'];
const platformColorCache = {};
function getPlatformColor(name){
  if(PLATFORM_COLORS[name]) return PLATFORM_COLORS[name];
  if(platformColorCache[name]) return platformColorCache[name];
  let hash = 0;
  for(let i=0;i<name.length;i++){ hash = (hash*31 + name.charCodeAt(i)) >>> 0; }
  const color = EXTRA_HUES[hash % EXTRA_HUES.length];
  platformColorCache[name] = color;
  return color;
}
function getAllPlatforms(){
  const fromOrders = Array.from(new Set(state.orders.map(o=>o.platform))).filter(Boolean);
  const combined = Array.from(new Set([...KNOWN_PLATFORMS, ...fromOrders]));
  const known = KNOWN_PLATFORMS.filter(p=>combined.includes(p));
  const custom = combined.filter(p=>!KNOWN_PLATFORMS.includes(p) && p!=='Other').sort();
  const hasOther = combined.includes('Other');
  return [...known, ...custom, ...(hasOther?['Other']:[])];
}

const STATUSES = ['Ordered','Shipped','Out for Delivery','Delivered','Cancelled','Returned','Unknown'];

let state = {
  orders: [],
  filter: 'All',
  search: '',
  syncing: false,
  syncError: null,
  syncMsg: null,
  modalOpen: false,
  loaded: false,
  syncSeconds: 0,
  syncDebug: null,
  sidebarOpen: false,
  theme: 'light',
};

function iconSvg(name){
  const icons = {
    refresh: '<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
    trash: '<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
    info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
    package: '<path d="M16.5 9.4 7.5 4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>',
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
    wallet: '<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    layers: '<path d="m12.83 2.18 8.53 4.4a1.5 1.5 0 0 1 0 2.67l-8.53 4.4a2 2 0 0 1-1.66 0L2.64 9.25a1.5 1.5 0 0 1 0-2.67l8.53-4.4a2 2 0 0 1 1.66 0Z"/><path d="m22 12.5-8.53 4.4a2 2 0 0 1-1.66 0L2 12.5"/><path d="m22 17.5-8.53 4.4a2 2 0 0 1-1.66 0L2 17.5"/>',
    menu: '<path d="M4 6h16M4 12h16M4 18h16"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/>',
  };
  return `<svg class="icon nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${icons[name]||''}</svg>`;
}

async function loadTheme(){
  let saved = null;
  try{
    const res = await window.storage.get('theme', false);
    saved = res ? res.value : null;
  }catch(e){ /* no stored preference yet */ }
  if(saved === 'dark' || saved === 'light'){
    state.theme = saved;
  }else{
    state.theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  }
  applyTheme();
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
}

async function toggleTheme(){
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  applyTheme();
  render();
  try{ await window.storage.set('theme', state.theme, false); }catch(e){ console.error('Theme save failed', e); }
}

async function loadOrders(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    state.orders = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    state.orders = [];
  }
  state.loaded = true;
  render();
}

async function saveOrders(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(state.orders), false);
  }catch(e){
    console.error('Storage save failed', e);
  }
}

function keyFor(o){
  return (o.platform||'') + '::' + (o.orderId || (o.item||'') + '::' + (o.orderDate||''));
}

function mergeOrders(newOnes){
  const existingKeys = new Set(state.orders.map(keyFor));
  let added = 0;
  newOnes.forEach(o=>{
    const norm = normalizeOrder(o, 'gmail');
    if(!norm) return;
    const k = keyFor(norm);
    if(!existingKeys.has(k)){
      state.orders.push(norm);
      existingKeys.add(k);
      added++;
    }
  });
  return added;
}

function normalizeOrder(o, source){
  if(!o || !o.item) return null;
  let platform = (o.platform||'Other').toString().trim();
  if(!platform) platform = 'Other';
  if(platform.length > 30) platform = platform.slice(0,30);
  if(!KNOWN_PLATFORMS.includes(platform) && platform !== 'Other'){
    platform = platform.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
  }
  let status = (o.status||'Unknown');
  if(!STATUSES.includes(status)) status = 'Unknown';
  let price = o.price;
  if(typeof price === 'string') price = parseFloat(price.replace(/[^0-9.]/g,''));
  if(typeof price !== 'number' || isNaN(price)) price = null;
  return {
    id: (crypto.randomUUID ? crypto.randomUUID() : Date.now()+Math.random().toString(16).slice(2)),
    platform, item: String(o.item).slice(0,120),
    orderId: o.orderId || null,
    price, currency:'INR',
    status,
    orderDate: o.orderDate || null,
    source
  };
}

let syncTimerInterval = null;

async function syncGmail(days){
  days = days || 30;
  state.syncing = true; state.syncError = null; state.syncMsg = null; state.syncSeconds = 0; state.syncDebug = null;
  render();
  syncTimerInterval = setInterval(()=>{ state.syncSeconds++; updateSyncTimerDisplay(); }, 1000);

  const timeoutMs = 55000;
  let timedOut = false;

  try{
    const fetchPromise = fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "anthropic-beta": "mcp-client-2025-04-04"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 6144,
        system: `You are an order-extraction assistant with access to a Gmail search tool. Run exactly 5 searches total, covering roughly the last ${days} days and including Promotions/Updates categories, not just Primary/Inbox. Do not stop early — run all 5 before writing any output:

1. Amazon — query: (from:amazon.in OR from:amazon.com) (order OR shipped OR delivered OR dispatched OR "out for delivery")
2. Flipkart — query: from:flipkart.com (order OR shipped OR delivered OR dispatched OR "out for delivery")
3. Myntra — query: from:myntra.com (order OR shipped OR delivered OR dispatched OR "out for delivery")
4. Ajio — query: from:ajio.com (order OR shipped OR delivered OR dispatched OR "out for delivery")
5. Everything else — query: (subject:"order confirmation" OR subject:"your order" OR subject:"order confirmed" OR subject:"has shipped" OR subject:"has been shipped" OR subject:"out for delivery" OR subject:"order delivered") -from:amazon.in -from:amazon.com -from:flipkart.com -from:myntra.com -from:ajio.com
   This 5th search catches any other retailer — e.g. Uniqlo, H&M, Nike, Zara, Nykaa, or any other online store. For results from this search, set "platform" to the actual brand/retailer name inferred from the sender address or email content (e.g. "Uniqlo"), not a generic label.

For each order found, extract: platform (Amazon, Flipkart, Myntra, Ajio, or the actual brand name for anything else), item (short product name), orderId (string or null), price (plain number, no currency symbol or commas, or null), status (one of Ordered, Shipped, Out for Delivery, Delivered, Cancelled, Returned, Unknown), orderDate (YYYY-MM-DD or null).

Skip pure marketing/promotional emails (sale announcements, discount codes, "grab X% off") that are not actually confirming, shipping, or delivering a specific order — only include emails tied to a real purchase. Aim to include results from every platform that has genuine order emails — do not let one platform crowd out the others. Cap the total list at 30 most recent distinct orders, spread across platforms rather than all from one. Respond with ONLY a raw JSON array of these objects — no markdown fences, no commentary, no text before or after.`,
        messages: [{ role:"user", content:`Search my Gmail from the last ${days} days and extract my recent e-commerce orders as instructed.` }],
        mcp_servers: [{ type:"url", url:"https://gmailmcp.googleapis.com/mcp/v1", name:"gmail-mcp" }]
      })
    });

    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => { timedOut = true; reject(new Error('__TIMEOUT__')); }, timeoutMs);
    });

    const response = await Promise.race([fetchPromise, timeoutPromise]);
    if(!response.ok){
      let bodyText = '';
      try{ bodyText = await response.text(); }catch(e2){}
      state.syncDebug = `HTTP ${response.status}\n${bodyText.slice(0,600)}`;
      throw new Error(`Request failed (${response.status}). See sync details below.`);
    }
    const data = await response.json();
    if(data.type === 'error'){
      state.syncDebug = JSON.stringify(data, null, 2).slice(0,600);
      throw new Error(data.error && data.error.message ? data.error.message : "API returned an error. See sync details below.");
    }

    const toolCalls = (data.content||[]).filter(b=>b.type==='mcp_tool_use');
    const toolResults = (data.content||[]).filter(b=>b.type==='mcp_tool_result');
    const debugLines = [];
    debugLines.push(`Stop reason: ${data.stop_reason || 'unknown'}`);
    debugLines.push(`Tool calls made: ${toolCalls.length}`);
    toolCalls.forEach((tc,i)=>{ debugLines.push(`  ${i+1}. ${tc.name}(${JSON.stringify(tc.input)})`); });
    toolResults.forEach((tr,i)=>{
      const resText = tr.content && tr.content[0] && tr.content[0].text ? tr.content[0].text : JSON.stringify(tr.content);
      debugLines.push(`  Result ${i+1} (first 200 chars): ${String(resText).slice(0,200)}`);
    });
    state.syncDebug = debugLines.join('\n');
    console.log('Gmail sync debug:', state.syncDebug, data);

    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    let clean = textBlocks.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const firstBracket = clean.indexOf('[');
    const lastBracket = clean.lastIndexOf(']');
    if(firstBracket !== -1 && lastBracket !== -1){ clean = clean.slice(firstBracket, lastBracket+1); }
    let parsed;
    try{ parsed = JSON.parse(clean); }catch(e){ throw new Error("Couldn't read the response as order data."); }
    if(!Array.isArray(parsed)) throw new Error("Unexpected response format.");
    const added = mergeOrders(parsed);
    await saveOrders();
    state.syncMsg = added > 0
      ? `Synced ${added} new order${added===1?'':'s'} from Gmail.`
      : (parsed.length === 0 ? `No order emails found in the last ${days} days.` : "No new orders — everything found was already tracked.");
  }catch(e){
    if(timedOut || e.message === '__TIMEOUT__'){
      state.syncError = "Sync timed out. Gmail searches can be slow on the first run — try again, or use a shorter window (7 or 14 days) above.";
    }else{
      state.syncError = e.message || "Sync failed. You can try again, or add orders manually below.";
    }
  }
  clearInterval(syncTimerInterval);
  state.syncing = false;
  render();
}

function updateSyncTimerDisplay(){
  const el = document.getElementById('sync-timer');
  if(el) el.textContent = `Syncing… ${state.syncSeconds}s`;
}

function deleteOrder(id){
  state.orders = state.orders.filter(o=>o.id!==id);
  saveOrders();
  render();
}

function addManualOrder(formData){
  const norm = normalizeOrder(formData, 'manual');
  if(norm){ state.orders.push(norm); saveOrders(); }
  state.modalOpen = false;
  render();
}

function setFilter(f){ state.filter = f; state.sidebarOpen = false; render(); }
function setSearch(v){ state.search = v; render(); }
function toggleSidebar(){ state.sidebarOpen = !state.sidebarOpen; render(); }

function getFiltered(){
  let list = state.orders.slice();
  if(state.filter !== 'All') list = list.filter(o=>o.platform === state.filter);
  if(state.search.trim()){
    const q = state.search.toLowerCase();
    list = list.filter(o => o.item.toLowerCase().includes(q) || (o.orderId||'').toLowerCase().includes(q));
  }
  list.sort((a,b)=> (b.orderDate||'').localeCompare(a.orderDate||''));
  return list;
}

function statusColors(s){
  const map = {
    Delivered: ['var(--success-soft)','var(--success)'],
    Shipped: ['var(--warning-soft)','var(--warning)'],
    'Out for Delivery': ['var(--warning-soft)','var(--warning)'],
    Ordered: ['var(--primary-soft)','var(--primary-dark)'],
    Cancelled: ['var(--danger-soft)','var(--danger)'],
    Returned: ['var(--danger-soft)','var(--danger)'],
    Unknown: ['var(--tint)','var(--muted)'],
  };
  return map[s] || map.Unknown;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str==null ? '' : str;
  return d.innerHTML;
}

function renderSidebar(){
  const platforms = getAllPlatforms();
  const platformItems = platforms.map(p=>{
    const count = state.orders.filter(o=>o.platform===p).length;
    return `
      <button class="nav-item ${state.filter===p?'active':''}" onclick="setFilter('${p.replace(/'/g,"\\'")}')">
        <span class="dot" style="background:${getPlatformColor(p)}"></span>
        <span class="n-label">${escapeHtml(p)}</span>
        <span class="n-count">${count}</span>
      </button>`;
  }).join('');

  return `
    <aside class="sidebar ${state.sidebarOpen?'open':''}">
      <div class="brand">
        <div class="brand-mark">${iconSvg('package')}</div>
        <div>
          <div class="brand-name">Consignment</div>
          <div class="brand-tag">Order Dashboard</div>
        </div>
      </div>

      <div>
        <div class="nav-section-label">Overview</div>
        <div class="nav-list">
          <button class="nav-item ${state.filter==='All'?'active':''}" onclick="setFilter('All')">
            ${iconSvg('grid')}
            <span class="n-label">All Orders</span>
            <span class="n-count">${state.orders.length}</span>
          </button>
        </div>
      </div>

      <div>
        <div class="nav-section-label">Platforms</div>
        <div class="nav-list">${platformItems || `<div style="padding:8px 12px; font-size:12px; color:var(--muted);">None yet</div>`}</div>
      </div>

      <div class="sidebar-footer">
        ${iconSvg('info')} Orders sync from your connected Gmail account and stay private to you.
      </div>
    </aside>
  `;
}

function renderTopbar(){
  return `
    <header class="topbar">
      <button class="btn" style="display:none" id="hamburger-btn" onclick="toggleSidebar()">${iconSvg('menu')}</button>
      <div>
        <h1>Order Dashboard</h1>
        <div class="sub">Every parcel, one manifest.</div>
      </div>
      <div class="topbar-spacer"></div>
      <div class="search-wrap">
        ${iconSvg('search')}
        <input class="search-input" placeholder="Search item or order ID…" value="${escapeHtml(state.search)}" oninput="setSearch(this.value)">
      </div>
      <select id="sync-range" class="range-select" ${state.syncing?'disabled':''}>
        <option value="7">Last 7 days</option>
        <option value="14">Last 14 days</option>
        <option value="30" selected>Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <button class="btn" onclick="openModal()">${iconSvg('plus')} Add order</button>
      <button class="btn" title="Toggle dark mode" onclick="toggleTheme()">${iconSvg(state.theme==='dark' ? 'sun' : 'moon')}</button>
      <button class="btn btn-primary" ${state.syncing?'disabled':''} onclick="syncGmail(parseInt(document.getElementById('sync-range').value,10))">
        <span class="${state.syncing?'spin':''}">${iconSvg('refresh')}</span>
        <span id="sync-timer">${state.syncing ? `Syncing… ${state.syncSeconds||0}s` : 'Sync Gmail'}</span>
      </button>
    </header>
  `;
}

function renderStatCards(){
  const orders = state.orders;
  const total = orders.length;
  const spent = orders.reduce((s,o)=>s+(o.price||0),0);
  const delivered = orders.filter(o=>o.status==='Delivered').length;
  const platformsCount = new Set(orders.map(o=>o.platform)).size;
  return `
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon primary">${iconSvg('grid')}</div>
        <div class="stat-value">${total}</div>
        <div class="stat-label">Total Orders</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon success">${iconSvg('wallet')}</div>
        <div class="stat-value">₹${spent.toLocaleString('en-IN')}</div>
        <div class="stat-label">Gross Spend</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon warning">${iconSvg('check')}</div>
        <div class="stat-value">${delivered}</div>
        <div class="stat-label">Delivered</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon other">${iconSvg('layers')}</div>
        <div class="stat-value">${platformsCount}</div>
        <div class="stat-label">Platforms</div>
      </div>
    </div>
  `;
}

function renderSpendCard(){
  const orders = state.orders;
  const isReturned = o => o.status === 'Cancelled' || o.status === 'Returned';
  const isDelivered = o => o.status === 'Delivered';
  const isPending = o => !isReturned(o) && !isDelivered(o);

  const kept = orders.filter(isDelivered).reduce((s,o)=>s+(o.price||0),0);
  const pending = orders.filter(isPending).reduce((s,o)=>s+(o.price||0),0);
  const returned = orders.filter(isReturned).reduce((s,o)=>s+(o.price||0),0);
  const net = kept + pending;
  const keptCount = orders.filter(isDelivered).length;
  const pendingCount = orders.filter(isPending).length;
  const returnedCount = orders.filter(isReturned).length;

  return `
    <div class="card">
      <div class="card-title">Spend Breakdown <span class="hint">by order status</span></div>
      <div class="spend-row">
        <span class="spend-dot" style="background:var(--success)"></span>
        <div class="spend-info"><div class="spend-name">Kept — Delivered</div><div class="spend-count">${keptCount} orders</div></div>
        <div class="spend-amt">₹${kept.toLocaleString('en-IN')}</div>
      </div>
      <div class="spend-row">
        <span class="spend-dot" style="background:var(--warning)"></span>
        <div class="spend-info"><div class="spend-name">Pending — In progress</div><div class="spend-count">${pendingCount} orders</div></div>
        <div class="spend-amt">₹${pending.toLocaleString('en-IN')}</div>
      </div>
      <div class="spend-row">
        <span class="spend-dot" style="background:var(--danger)"></span>
        <div class="spend-info"><div class="spend-name">Returned / Cancelled / Refunded</div><div class="spend-count">${returnedCount} orders</div></div>
        <div class="spend-amt neg">&minus; ₹${returned.toLocaleString('en-IN')}</div>
      </div>
      <div class="spend-total-row">
        <span class="spend-total-label">Net Spend</span>
        <span class="spend-total-amt">₹${net.toLocaleString('en-IN')}</span>
      </div>
    </div>
  `;
}

function renderMixCard(){
  const orders = state.orders;
  const platforms = getAllPlatforms().filter(p => orders.some(o=>o.platform===p));
  const total = orders.length || 1;
  const bar = platforms.map(p=>{
    const count = orders.filter(o=>o.platform===p).length;
    const pct = (count/total*100);
    return `<span style="width:${pct}%; background:${getPlatformColor(p)}"></span>`;
  }).join('');
  const list = platforms.map(p=>{
    const count = orders.filter(o=>o.platform===p).length;
    const spend = orders.filter(o=>o.platform===p).reduce((s,o)=>s+(o.price||0),0);
    return `
      <div class="mix-item">
        <span class="swatch" style="background:${getPlatformColor(p)}"></span>
        <span class="m-name">${escapeHtml(p)}</span>
        <span class="m-val">${count} · ₹${spend.toLocaleString('en-IN')}</span>
      </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title">Platform Mix</div>
      <div class="mix-bar">${bar || `<span style="width:100%; background:var(--tint)"></span>`}</div>
      <div class="mix-list">${list || `<div style="font-size:12px; color:var(--muted);">No orders yet</div>`}</div>
    </div>
  `;
}

function renderOrdersTable(){
  const filtered = getFiltered();
  if(!state.loaded){
    return `<div class="table-card"><div class="empty-state">Loading your ledger…</div></div>`;
  }
  if(filtered.length === 0){
    return `
      <div class="table-card">
        <div class="empty-state">
          <div class="display">${iconSvg('package')} Nothing here yet</div>
          <div>Sync from Gmail or add your first order manually.</div>
        </div>
      </div>`;
  }
  const rows = filtered.map(o=>{
    const [bg, fg] = statusColors(o.status);
    const priceStr = o.price!=null ? '₹' + o.price.toLocaleString('en-IN') : '—';
    return `
      <tr>
        <td>
          <div class="item-cell">
            <span class="item-swatch" style="background:${getPlatformColor(o.platform)}"></span>
            <div>
              <div class="item-name">${escapeHtml(o.item)}</div>
              ${o.orderId ? `<div class="item-sub">#${escapeHtml(o.orderId)}</div>` : ''}
            </div>
          </div>
        </td>
        <td><span class="badge" style="background:${getPlatformColor(o.platform)}22; color:${getPlatformColor(o.platform)}">${escapeHtml(o.platform)}</span></td>
        <td class="date-cell">${escapeHtml(o.orderDate || '—')}</td>
        <td><span class="badge" style="background:${bg}; color:${fg}">${escapeHtml(o.status)}</span></td>
        <td class="price-cell">${priceStr}</td>
        <td><button class="del-btn" onclick="deleteOrder('${o.id}')">${iconSvg('trash')}</button></td>
      </tr>`;
  }).join('');

  return `
    <div class="table-card">
      <div class="table-head">
        <div class="card-title">${state.filter === 'All' ? 'All Orders' : state.filter + ' Orders'} <span class="hint">${filtered.length} shown</span></div>
      </div>
      <table>
        <thead><tr><th>Item</th><th>Platform</th><th>Date</th><th>Status</th><th style="text-align:right;">Price</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderModal(){
  if(!state.modalOpen) return '';
  const known = getAllPlatforms().filter(p=>p!=='Other');
  return `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>Add order manually</h3>
        <form id="manual-form" onsubmit="return handleManualSubmit(event)">
          <div class="field"><label>Platform</label>
            <input name="platform" list="platform-options" placeholder="e.g. Amazon, Uniqlo, H&amp;M" required>
            <datalist id="platform-options">${known.map(p=>`<option value="${p}">`).join('')}</datalist>
          </div>
          <div class="field"><label>Item</label><input name="item" required placeholder="e.g. Wireless earbuds"></div>
          <div class="field"><label>Price (₹)</label><input name="price" type="number" step="0.01" placeholder="1299"></div>
          <div class="field"><label>Status</label>
            <select name="status">${STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Order date</label><input name="orderDate" type="date"></div>
          <div class="field"><label>Order ID (optional)</label><input name="orderId" placeholder="e.g. 402-1234567"></div>
          <div class="modal-actions">
            <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn btn-primary">Add order</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function closeModal(){ state.modalOpen = false; render(); }
function openModal(){ state.modalOpen = true; render(); }

function handleManualSubmit(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  addManualOrder({
    platform: fd.get('platform'),
    item: fd.get('item'),
    price: fd.get('price'),
    status: fd.get('status'),
    orderDate: fd.get('orderDate'),
    orderId: fd.get('orderId'),
  });
  return false;
}

function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="app">
      ${renderSidebar()}
      <div class="main">
        ${renderTopbar()}
        <div class="content">
          ${state.syncError ? `<div class="banner banner-error">${iconSvg('info')} ${escapeHtml(state.syncError)}</div>` : ''}
          ${state.syncMsg ? `<div class="banner banner-success">${iconSvg('check')} ${escapeHtml(state.syncMsg)}</div>` : ''}
          ${state.syncDebug ? `
            <details class="debug">
              <summary>Sync details (debug)</summary>
              <pre>${escapeHtml(state.syncDebug)}</pre>
            </details>
          ` : ''}
          ${renderStatCards()}
          <div class="grid-2">
            ${renderSpendCard()}
            ${renderMixCard()}
          </div>
          ${renderOrdersTable()}
        </div>
      </div>
    </div>
    ${renderModal()}
  `;
}

loadTheme().then(loadOrders);
</script>
</body>
</html>
